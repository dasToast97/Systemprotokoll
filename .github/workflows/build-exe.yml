name: EXE bauen

on:
  push:
    branches: [main, auto-update]   # auto-update = Testzweig: bauen und testen, aber kein Release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Versionsinfo erzeugen
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @"
          static class BuildInfo
          {
              public const string Version = "$version";
              public const string Repo = "${{ github.repository }}";
          }
          "@ | Set-Content BuildInfo.cs -Encoding UTF8

      - name: Systemprotokoll.exe kompilieren
        shell: pwsh
        run: |
          $fw = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
          & "$fw\csc.exe" /nologo /target:winexe /platform:anycpu /optimize+ /out:Systemprotokoll.exe /win32manifest:app.manifest `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll /r:"$fw\System.Web.Extensions.dll" `
            /resource:Systemprotokoll.ps1,Systemprotokoll.ps1 Launcher.cs Updater.cs Oberflaeche.cs BuildInfo.cs
          if ($LASTEXITCODE -ne 0) { throw "Kompilieren fehlgeschlagen" }
          Get-FileHash Systemprotokoll.exe -Algorithm SHA256 | Format-List

      - name: Skript auf Syntaxfehler pruefen
        shell: powershell
        run: |
          $err = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\Systemprotokoll.ps1", [ref]$null, [ref]$err) | Out-Null
          if ($err) { $err | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }

      - name: Version und Update-Pruefung testen
        shell: powershell
        run: |
          function Exe([string[]]$a) {
            $out = Join-Path $env:RUNNER_TEMP 'out.txt'
            $p = Start-Process .\Systemprotokoll.exe -ArgumentList $a -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
            [pscustomobject]@{ Code = $p.ExitCode; Text = (Get-Content $out -Raw).Trim() }
          }
          $v = Exe '--version'
          Write-Host "EXE-Version: $($v.Text)"
          if ($v.Text -ne $env:VERSION) { throw "Falsche Version: $($v.Text)" }
          $u = Exe '--update-test'
          Write-Host $u.Text
          if ($u.Code -ne 0) { throw "Update-Pruefung fehlgeschlagen" }

      - name: Testlauf still (2 Tage, Schnellmodus)
        shell: powershell
        run: |
          $ziel = Join-Path $env:RUNNER_TEMP 'test\still'
          $von = (Get-Date).AddDays(-2).ToString('dd.MM.yyyy HH:mm')
          $p = Start-Process .\Systemprotokoll.exe -ArgumentList '-Von', "`"$von`"", '-Dauer', '2', '-Schnell', '-Still', '-Ziel', "`"$ziel`"" -NoNewWindow -Wait -PassThru
          Write-Host "Exit-Code: $($p.ExitCode)"
          $bericht = Get-ChildItem $ziel -Recurse -Filter Zustandsbericht.html | Select-Object -First 1
          if (-not $bericht) { throw 'Kein Bericht erzeugt (Ziel wird neu angelegt?)' }
          $html = Get-Content $bericht.FullName -Raw
          if ($html -notmatch 'Ausgewerteter Zeitraum') { throw 'Zeitraum fehlt im Bericht' }
          if ($html -notmatch [regex]::Escape("Systemprotokoll.exe $env:VERSION")) { throw 'Tool-Version fehlt im Bericht' }

      - name: Testlauf mit Fortschrittsfenster
        shell: powershell
        env:
          SYSTEMPROTOKOLL_SCREENSHOTS: ${{ runner.temp }}\screens
        run: |
          $ziel = Join-Path $env:RUNNER_TEMP 'test\gui'
          $von = (Get-Date).AddDays(-2).ToString('dd.MM.yyyy HH:mm')
          $p = Start-Process .\Systemprotokoll.exe -ArgumentList '--gui-test', '-Von', "`"$von`"", '-Dauer', '2', '-Schnell', '-Ziel', "`"$ziel`"" -PassThru
          if (-not $p.WaitForExit(900000)) { $p.Kill(); throw 'Zeitueberschreitung' }
          Write-Host "Exit-Code: $($p.ExitCode)"
          Get-ChildItem $env:SYSTEMPROTOKOLL_SCREENSHOTS -ErrorAction SilentlyContinue | Format-Table Name, Length
          if ($p.ExitCode -ne 0) { throw "GUI-Lauf fehlgeschlagen (Exit-Code $($p.ExitCode))" }
          if (-not (Get-ChildItem $ziel -Recurse -Filter Zustandsbericht.html)) { throw 'Kein Bericht erzeugt' }

      - name: Fenster-Vorschau sichern
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'screens'
          $files = Get-ChildItem $dir -Filter *.png -ErrorAction SilentlyContinue
          if (-not $files) { Write-Host 'Keine Bilder'; exit 0 }
          $entries = foreach ($f in $files) { $h = git hash-object -w $f.FullName; "100644 blob $h`t$($f.Name)" }
          $liste = Join-Path $env:RUNNER_TEMP 'tree.txt'
          [IO.File]::WriteAllText($liste, (($entries -join "`n") + "`n"))
          $tree = Get-Content $liste -Raw | git mktree
          $commit = git -c user.name=ci -c user.email=ci@localhost commit-tree $tree -m "Fenster-Vorschau $env:VERSION"
          git push --force origin "${commit}:refs/ci/vorschau"

      - name: Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: ${{ runner.temp }}/test

      - name: Paket packen
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory Systemprotokoll-Tool | Out-Null
          Copy-Item Systemprotokoll.exe, Systemprotokoll.ps1, Systemprotokoll_starten.bat, README.md, LICENSE Systemprotokoll-Tool/
          Compress-Archive Systemprotokoll-Tool/* Systemprotokoll-Tool.zip

      - name: Release veroeffentlichen
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $hash = (Get-FileHash Systemprotokoll.exe -Algorithm SHA256).Hash
          $aenderung = (git log -1 --pretty=%B | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }) -join "`n"
          $notes = "## Neu in dieser Version`n`n$($aenderung.Trim())`n`n---`nSystemprotokoll.exe herunterladen, doppelklicken, Administratorrechte bestaetigen. Bereits installierte Versionen aktualisieren sich beim naechsten Start selbst.`n`nSHA256 der EXE: $hash"
          gh release create $tag Systemprotokoll.exe Systemprotokoll-Tool.zip --title "Systemprotokoll $tag" --notes $notes --latest
